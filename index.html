<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Test 6</title>
<style>
body{font-family:sans-serif;padding:20px;background:#e8f4fd;direction:rtl;}
button{padding:20px;font-size:18px;margin:8px 0;border-radius:12px;border:none;background:#1565c0;color:#fff;cursor:pointer;display:block;width:100%;}
#log{margin-top:16px;padding:12px;background:#fff;border-radius:8px;font-size:14px;line-height:2;}
</style>
</head>
<body>
<h2>בדיקה 6</h2>

<audio id="bg" loop preload="none">
  <!-- Free CC0 music from pixabay CDN -->
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mp3">
</audio>

<button id="b1">🎵 הפעל מוזיקה</button>
<button id="b2">🎵🗣️ מוזיקה + קול יחד</button>
<button id="b3">⏹ עצור</button>
<div id="log">לחץ...</div>
<script>
var log=document.getElementById('log');
function L(t){log.innerHTML+=t+'<br>';}
var bg=document.getElementById('bg');
bg.volume=0.25;

function getVoice(){
  var vs=window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++)
    if(vs[i].lang&&vs[i].lang.startsWith('he'))return vs[i];
  return null;
}
function say(text,cb){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  var v=getVoice();if(v)u.voice=v;
  u.lang='he-IL';u.rate=0.85;u.volume=1;
  u.onstart=function(){L('▶ '+text);};
  u.onend=function(){L('✓ '+text);if(cb)setTimeout(cb,200);};
  u.onerror=function(e){L('✗ '+e.error);if(cb)setTimeout(cb,200);};
  window.speechSynthesis.speak(u);
}

document.getElementById('b1').addEventListener('click',function(){
  log.innerHTML='מפעיל מוזיקה...<br>';
  bg.load();
  bg.play()
    .then(function(){L('🎵 מוזיקה עובדת!');})
    .catch(function(e){L('✗ שגיאה: '+e.message);});
});

document.getElementById('b2').addEventListener('click',function(){
  log.innerHTML='מוזיקה + קול ביחד:<br>';
  bg.load();
  bg.play().catch(function(){});
  var names=['כל הכבוד','אורי','רוחמה','נגה'];
  var i=0;
  function next(){
    if(i>=names.length){L('🎉 סיים!');return;}
    say(names[i++],next);
  }
  next();
});

document.getElementById('b3').addEventListener('click',function(){
  bg.pause();bg.currentTime=0;
  window.speechSynthesis.cancel();
  log.innerHTML='עצרנו<br>';
});

window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};
</script>
</body>
</html>
