<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Test 5</title>
<style>
body{font-family:sans-serif;padding:20px;background:#e8f4fd;direction:rtl;}
button{padding:20px;font-size:18px;margin:8px 0;border-radius:12px;border:none;background:#1565c0;color:#fff;cursor:pointer;display:block;width:100%;}
#log{margin-top:16px;padding:12px;background:#fff;border-radius:8px;font-size:14px;line-height:2;}
</style>
</head>
<body>
<h2>בדיקה 5 - audio tag + speech</h2>

<!-- Music via HTML audio tag (no AudioContext) -->
<audio id="bgmusic" loop preload="auto">
  <source src="https://upload.wikimedia.org/wikipedia/commons/transcoded/8/8b/Johann_Pachelbel_-_Canon_in_D_major_%28piano_version%29.ogg/Johann_Pachelbel_-_Canon_in_D_major_%28piano_version%29.ogg.mp3" type="audio/mp3">
</audio>

<button id="b1">הפעל מוזיקה</button>
<button id="b2">דבר עם מוזיקה</button>
<button id="b3">עצור הכל</button>
<div id="log">לחץ...</div>
<script>
var log=document.getElementById('log');
function L(t){log.innerHTML+=t+'<br>';}
var music=document.getElementById('bgmusic');
music.volume=0.3;

function getVoice(){
  var vs=window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++)
    if(vs[i].lang&&vs[i].lang.startsWith('he'))return vs[i];
  return null;
}
function say(text,cb){
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  var v=getVoice();if(v)u.voice=v;
  u.lang='he-IL';u.rate=0.85;u.volume=1;
  u.onstart=function(){L('▶ '+text);};
  u.onend=function(){L('✓ '+text);if(cb)setTimeout(cb,200);};
  u.onerror=function(e){L('✗ '+e.error);if(cb)setTimeout(cb,200);};
  window.speechSynthesis.speak(u);
}

document.getElementById('b1').addEventListener('click',function(){
  log.innerHTML='מפעיל מוזיקה...<br>';
  music.play().then(function(){L('🎵 מוזיקה רצה!');}).catch(function(e){L('✗ מוזיקה: '+e);});
});

document.getElementById('b2').addEventListener('click',function(){
  log.innerHTML='מוזיקה + קול:<br>';
  music.play().catch(function(){});
  var names=['אורי','רוחמה','נגה'];
  var i=0;
  function next(){
    if(i>=names.length){L('סיים!');return;}
    say(names[i++],next);
  }
  next();
});

document.getElementById('b3').addEventListener('click',function(){
  music.pause();music.currentTime=0;
  window.speechSynthesis.cancel();
  log.innerHTML='עצרנו הכל<br>';
});

window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};
</script>
</body>
</html>
