<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Test</title>
<style>
body{font-family:sans-serif;padding:20px;background:#e8f4fd;}
button{padding:20px 30px;font-size:18px;margin:10px;border-radius:12px;border:none;background:#1565c0;color:#fff;cursor:pointer;display:block;width:100%;}
#log{margin-top:20px;padding:10px;background:#fff;border-radius:8px;font-size:13px;white-space:pre-wrap;}
</style>
</head>
<body>
<h2>בדיקת קול - iOS</h2>
<button onclick="test1()">בדיקה 1: דיבור פשוט</button>
<button onclick="test2()">בדיקה 2: רצף שמות</button>
<button onclick="test3()">בדיקה 3: AudioContext + דיבור</button>
<div id="log">לחץ כפתור לבדיקה...</div>
<script>
var log=document.getElementById('log');
function L(t){log.textContent+='\n'+t;}

function getVoice(){
  var vs=window.speechSynthesis.getVoices();
  L('Voices: '+vs.length);
  for(var i=0;i<vs.length;i++){
    if(vs[i].lang&&vs[i].lang.toLowerCase().indexOf('he')>=0){
      L('Hebrew voice: '+vs[i].name);
      return vs[i];
    }
  }
  L('No Hebrew voice, using default');
  return null;
}

function test1(){
  log.textContent='Test 1: simple speak';
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance('שלום משפחה');
  var v=getVoice();if(v)u.voice=v;
  u.lang='he-IL';u.rate=0.9;u.volume=1;
  u.onstart=function(){L('onstart fired');}
  u.onend=function(){L('onend fired');}
  u.onerror=function(e){L('onerror: '+e.error);}
  window.speechSynthesis.speak(u);
  L('speak() called, speaking='+window.speechSynthesis.speaking);
}

function test2(){
  log.textContent='Test 2: sequence';
  var names=['אורי','רוחמה','אדוה','נגה'];
  var i=0;
  function next(){
    if(i>=names.length){L('done!');return;}
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(names[i]);
    var v=getVoice();if(v)u.voice=v;
    u.lang='he-IL';u.rate=0.9;
    u.onend=function(){L('said: '+names[i]);i++;setTimeout(next,300);};
    u.onerror=function(e){L('error at '+names[i]+': '+e.error);i++;setTimeout(next,300);};
    window.speechSynthesis.speak(u);
    L('speaking: '+names[i]);
    i++;
  }
  // DON'T increment i here - next() handles it
  i=0;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(names[i]);
  var v=getVoice();if(v)u.voice=v;
  u.lang='he-IL';u.rate=0.9;
  u.onend=function(){L('said: '+names[i-1]);setTimeout(next,300);};
  u.onerror=function(e){L('error: '+e.error);setTimeout(next,300);};
  window.speechSynthesis.speak(u);
  L('speaking: '+names[i]);
  i++;
}

function test3(){
  log.textContent='Test 3: AudioContext + speech';
  var AC=new(window.AudioContext||window.webkitAudioContext)();
  L('AC state: '+AC.state);
  AC.resume().then(function(){
    L('AC resumed, state: '+AC.state);
    // Play a beep
    var o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.frequency.value=440;g.gain.value=0.3;
    o.start();o.stop(AC.currentTime+0.3);
    L('beep played');
    // Then speak
    setTimeout(function(){
      var u=new SpeechSynthesisUtterance('כל הכבוד');
      var v=getVoice();if(v)u.voice=v;
      u.lang='he-IL';
      u.onstart=function(){L('speech started');}
      u.onend=function(){L('speech ended');}
      window.speechSynthesis.speak(u);
      L('speak called');
    },400);
  });
}
window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged=function(){L('voices changed: '+window.speechSynthesis.getVoices().length);};
</script>
</body>
</html>
