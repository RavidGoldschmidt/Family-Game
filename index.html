<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק המשפחה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html{height:100%;overflow:hidden;}
body{
  font-family:Helvetica,Arial,sans-serif;
  direction:rtl;
  display:flex;flex-direction:column;align-items:center;
  padding:4px 4px 6px;
  width:100%;height:100%;
  overflow:hidden;
  position:fixed;top:0;left:0;
  background:linear-gradient(180deg,#b8e4f7 0%,#7ec8e3 40%,#55b3d0 55%,#72c472 55%,#4a9e4a 100%);
  background-size:100% 100%;
}
h1{color:#fff;font-size:17px;font-weight:800;margin-bottom:3px;text-shadow:0 2px 6px rgba(0,0,0,0.3);}

#cw-wrap{background:rgba(255,255,255,0.18);border-radius:10px;padding:3px;margin-bottom:0px;border:1px solid rgba(255,255,255,0.4);display:inline-flex;justify-content:center;cursor:pointer;flex-shrink:0;}
#cw-wrap:active{background:rgba(255,255,255,0.30);}
#wd{height:24px;display:flex;flex-direction:row-reverse;gap:3px;justify-content:center;align-items:flex-end;margin:1px 0;flex-shrink:0;}
.wl{min-width:14px;height:22px;border-bottom:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;padding:0 2px;}
#mc{touch-action:none;cursor:pointer;display:block;flex-shrink:0;margin-top:-20px;}
#intro-msg{font-size:17px;font-weight:800;color:#fff;text-align:center;padding:3px 0;flex-shrink:0;text-shadow:0 2px 5px rgba(0,0,0,0.3);}
#timed-msg{font-size:12px;font-weight:800;color:#fff;min-height:14px;text-align:center;padding:2px 8px;border-radius:10px;transition:all 0.3s;flex-shrink:0;}
#timed-msg.show{background:rgba(0,0,0,0.22);}
#msg{font-size:12px;font-weight:800;color:#fff;min-height:14px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.3);flex-shrink:0;}
#pbar{display:flex;gap:1px;justify-content:center;flex-wrap:wrap;max-width:320px;flex-shrink:0;}
#found{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:340px;flex-shrink:0;}
.fc{font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;background:rgba(255,255,255,0.28);color:#fff;border:1px solid rgba(255,255,255,0.6);}


</style>
</head>
<body>
<h1>🌸 משחק המשפחה</h1>
<div id="cw-wrap"><canvas id="cw"></canvas></div>

<div id="wd"></div>
<canvas id="mc"></canvas>
<div id="intro-msg">👨‍👩‍👧‍👦 מצא את שמות בני המשפחה!</div>
<div id="timed-msg"></div>
<div id="msg"></div>
<div id="pbar" style="display:none;"></div>
<div id="found"></div>



<script>
// Prevent ALL page scrolling on iOS
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive: false});

window.addEventListener('load', function(){

// ── DATA ──────────────────────────────────────────────
var NAMES=['אורי','רוחמה','אדוה','עופר','דלית','בארי','אפרת','מיקה','אבי','עדי','סוניה','יונה','ניר','רביד','להב','עלמה','איה','נגה'];
var NAME_EXTRAS = {
  'אורי': 'אורי — אור גדול!',
  'רוחמה': 'רוחמה — כמו רחמים!',
  'אדוה': 'אדוה — שמחה ואהבה!',
  'עופר': 'עופר — עופר כמו צבי!',
  'דלית': 'דלית — דלית ענבים!',
  'בארי': 'בארי — חזק כמו ארי!',
  'אפרת': 'אפרת — עיר בית לחם!',
  'מיקה': 'מיקה — מוזיקה!',
  'אבי': 'אבי — האבא שלי!',
  'עדי': 'עדי — עדי תכשיטים!',
  'סוניה': 'סוניה — שמש בספרדית!',
  'יונה': 'יונה — יונה שלום!',
  'ניר': 'ניר — שדה ניר!',
  'רביד': 'רביד — רביד זהב!',
  'להב': 'להב — להב אש!',
  'עלמה': 'עלמה — עלמה יפה!',
  'איה': 'איה — איה הציפור!',
  'נגה': 'נגה — נגה כוכב!'
};
var GR=17,GC=16,TP=16;
var CWS=10;


// ── LAYOUT ───────────────────────────────────────────────
var LAYOUT=[
  {word:'רוחמה',row:13,col:3,dir:'h'},{word:'אורי',row:12,col:4,dir:'v'},
  {word:'אדוה',row:10,col:7,dir:'v'},{word:'דלית',row:15,col:2,dir:'h'},
  {word:'בארי',row:10,col:6,dir:'h'},{word:'מיקה',row:9,col:9,dir:'v'},
  {word:'עדי',row:14,col:2,dir:'v'},{word:'להב',row:8,col:6,dir:'v'},
  {word:'עלמה',row:8,col:5,dir:'h'},{word:'איה',row:6,col:8,dir:'v'},
  {word:'אפרת',row:6,col:8,dir:'h'},{word:'אבי',row:16,col:0,dir:'h'},
  {word:'ניר',row:4,col:10,dir:'v'},{word:'נגה',row:4,col:10,dir:'h'},
  {word:'סוניה',row:0,col:12,dir:'v'},{word:'יונה',row:3,col:12,dir:'h'},
  {word:'עופר',row:1,col:11,dir:'h'},{word:'רביד',row:14,col:4,dir:'h'}
];

// ── GRID ──────────────────────────────────────────────
function buildGrid(){
  var g=[];
  for(var r=0;r<GR;r++){g.push([]);for(var c=0;c<GC;c++)g[r].push(null);}
  LAYOUT.forEach(function(L){
    L.word.split('').forEach(function(l,i){
      var r=L.dir==='h'?L.row:L.row+i;
      var c=L.dir==='h'?L.col+i:L.col;
      if(r<GR&&c<GC){if(!g[r][c])g[r][c]={letter:l,revealed:false};}
    });
  });
  return g;
}
var grid=buildGrid();

// ── SIZES ──────────────────────────────────────────────
var VW=Math.min(window.innerWidth||375,390);
var DPR=Math.min(window.devicePixelRatio||1,3);

// Crossword canvas
var CWel=document.getElementById('cw'),CTX=CWel.getContext('2d');
var CWW=GC*CWS+4, CWH=GR*CWS+4;
CWel.width=Math.round(CWW*DPR); CWel.height=Math.round(CWH*DPR);
CWel.style.width=CWW+'px'; CWel.style.height=CWH+'px';

// Main canvas
var SZ=Math.min(VW-4,Math.round(window.innerHeight*0.44));
var MC=document.getElementById('mc'),MX=MC.getContext('2d');
MC.width=Math.round(SZ*DPR); MC.height=Math.round(SZ*DPR);
MC.style.width=SZ+'px'; MC.style.height=SZ+'px';

var CX=SZ/2,CY=SZ*0.50;
var FR=SZ*0.105;
var LR=SZ*0.414,NR=SZ*0.072;

function pa(i){return 2*Math.PI*i/TP - Math.PI/2;}

// Letters
var seen={},allL=[];
NAMES.forEach(function(n){n.split('').forEach(function(l){if(!seen[l]){seen[l]=true;allL.push(l);}});});
allL.sort();
var tokens=allL.slice();
function shuf(a){for(var i=a.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=a[i];a[i]=a[j];a[j]=t;}}
shuf(tokens);
function np(i){var a=2*Math.PI*i/tokens.length-Math.PI/2;return{x:CX+LR*Math.cos(a),y:CY+LR*Math.sin(a)};}

// ── STATE ──────────────────────────────────────────────
var petals=TP,found=[],sel=[],drag=false,fp=[],anId=null;
var face='happy',fTimer=null,bubOn=false,bubText='',bTimer=null;
var ENC=['!כל הכבוד','!יופי','!מעולה','!אלוף','!נפלא','!מדהים'];

// ── SPEECH ──────────────────────────────────────────────
var pendingTexts = [];
var heVoice = null;

function loadVoice(){
  var vs = window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){
    if(vs[i].lang && vs[i].lang.toLowerCase().indexOf('he')===0){
      heVoice = vs[i]; break;
    }
  }
}
if(window.speechSynthesis){
  loadVoice();
  window.speechSynthesis.onvoiceschanged = loadVoice;
}

// Speak one text — NO cancel before speaking (cancel breaks iOS)
function sayOne(text, onDone){
  var u = new SpeechSynthesisUtterance(text);
  if(!heVoice) loadVoice();
  if(heVoice) u.voice = heVoice;
  u.lang = 'he-IL';
  u.rate = 0.85;
  u.volume = 1;
  u.onend = function(){ if(onDone) setTimeout(onDone, 250); };
  u.onerror = function(){ if(onDone) setTimeout(onDone, 250); };
  window.speechSynthesis.speak(u);
}

// Speak list one by one
function sayList(list, i){
  if(!i) i = 0;
  if(i >= list.length) return;
  sayOne(list[i], function(){ sayList(list, i+1); });
}

// Queue speech — spoken on next touchstart (iOS requires direct gesture)
function queueSpeech(t){ pendingTexts.push(t); }

// Call this from touchstart/click — guaranteed iOS gesture
function flushSpeech(){
  if(!pendingTexts.length) return;
  var list = pendingTexts.slice();
  pendingTexts = [];
  sayList(list, 0);
}

// ── TOUCH SOUND ──────────────────────────────────────────
var touchSoundAC = null;
function playTouchSound(){
  try{
    if(!touchSoundAC) touchSoundAC = new(window.AudioContext||window.webkitAudioContext)();
    var ac = touchSoundAC;
    if(ac.state==='suspended') ac.resume();
    // Random pitch between 500-900Hz for variety
    var freq = 500 + Math.random() * 400;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*0.85, ac.currentTime+0.08);
    g.gain.setValueAtTime(0.18, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.10);
    o.start(ac.currentTime);
    o.stop(ac.currentTime+0.11);
  }catch(e){}
}

// ── FUNNY SOUND ON MISTAKE ───────────────────────────────
function playFunnySound(){
  try{
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    // Descending "boing" sound
    var freqs=[400,320,240,180,140];
    freqs.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.type='sine';
      o.frequency.setValueAtTime(f,ac.currentTime+i*0.07);
      g.gain.setValueAtTime(0.25,ac.currentTime+i*0.07);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.07+0.12);
      o.start(ac.currentTime+i*0.07);
      o.stop(ac.currentTime+i*0.07+0.13);
    });
    // Add a funny "wobble" on top
    var o2=ac.createOscillator(),g2=ac.createGain();
    o2.connect(g2);g2.connect(ac.destination);
    o2.type='sawtooth';
    o2.frequency.setValueAtTime(300,ac.currentTime);
    o2.frequency.exponentialRampToValueAtTime(80,ac.currentTime+0.4);
    g2.gain.setValueAtTime(0.15,ac.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);
    o2.start(ac.currentTime);o2.stop(ac.currentTime+0.4);
  }catch(e){}
}

// ── TIMED MESSAGES ──────────────────────────────────────
function showTimedMsg(txt,spk){
  var el=document.getElementById('timed-msg');
  el.textContent=txt;el.classList.add('show');
  var spkText = spk||txt.replace(/[🤔👏🤩😤]/g,'').trim();
  queueSpeech(spkText); // spoken on next touch (timed msgs can't use gesture)
  setTimeout(function(){el.classList.remove('show');el.textContent='';},5000);
}
setTimeout(function(){showTimedMsg('אילו עוד בני משפחה אתה מכיר? 🤔','אילו עוד בני משפחה אתה מכיר?');},60000);
setTimeout(function(){showTimedMsg('יופי! אתה ממש מוצלח 👏','יופי! אתה ממש מוצלח');},120000);
setTimeout(function(){showTimedMsg('פששששש... אין עלייך! 🤩','פששש אין עלייך');},180000);
setTimeout(function(){showTimedMsg('אין לי את כל היום, תסיים כבר! 😤','אין לי את כל היום תסיים כבר');},240000);
queueSpeech('מצא את שמות המשפחה!');

// ── DRAW CW ──────────────────────────────────────────────
function drawCW(){
  CTX.setTransform(DPR,0,0,DPR,0,0);
  CTX.clearRect(0,0,CWW,CWH);
  for(var r=0;r<GR;r++) for(var c=0;c<GC;c++){
    var cell=grid[r][c];if(!cell)continue;
    var dc=GC-1-c,x=2+dc*CWS,y=2+r*CWS,s=CWS-2;
    if(cell.revealed){
      CTX.fillStyle='rgba(255,255,255,0.95)';CTX.strokeStyle='#64b5f6';CTX.lineWidth=0.8;
      CTX.beginPath();CTX.roundRect(x,y,s,s,2);CTX.fill();CTX.stroke();
      CTX.fillStyle='#1a3a6b';CTX.font='700 '+Math.floor(CWS*0.65)+'px Helvetica,sans-serif';
      CTX.textAlign='center';CTX.textBaseline='middle';CTX.fillText(cell.letter,x+s/2,y+s/2+0.5);
    } else {
      CTX.fillStyle='rgba(255,255,255,0.40)';CTX.strokeStyle='rgba(150,200,255,0.85)';CTX.lineWidth=0.8;
      CTX.beginPath();CTX.roundRect(x,y,s,s,2);CTX.fill();CTX.stroke();
    }
  }
}

// ── DRAW MAIN ────────────────────────────────────────────
function draw(){
  MX.setTransform(DPR,0,0,DPR,0,0);
  MX.clearRect(0,0,SZ,SZ);
  drawStem();drawPetals();drawCenter();drawFPs();drawRing();drawLines();
  if(bubOn)drawBubble();
}

function drawStem(){
  MX.save();MX.strokeStyle='#43a047';MX.lineWidth=Math.max(3,SZ*0.014);MX.lineCap='round';
  MX.beginPath();MX.moveTo(CX,CY+FR+1);MX.bezierCurveTo(CX+SZ*.03,CY+SZ*.14,CX-SZ*.01,CY+SZ*.26,CX,CY+SZ*.44);MX.stroke();
  MX.fillStyle='#66bb6a';MX.strokeStyle='#388e3c';MX.lineWidth=0.7;
  MX.beginPath();MX.moveTo(CX+SZ*.02,CY+SZ*.1);MX.bezierCurveTo(CX+SZ*.1,CY+SZ*.06,CX+SZ*.09,CY+SZ*.18,CX+SZ*.025,CY+SZ*.17);MX.closePath();MX.fill();MX.stroke();
  MX.beginPath();MX.moveTo(CX-SZ*.01,CY+SZ*.2);MX.bezierCurveTo(CX-SZ*.1,CY+SZ*.16,CX-SZ*.09,CY+SZ*.28,CX-SZ*.025,CY+SZ*.27);MX.closePath();MX.fill();MX.stroke();
  MX.restore();
}

function drawPetals(){
  // 16 petals directly around flower center — real flower look
  var PR=FR*1.75;  // slightly closer to center
  var PH=FR*0.88;  // slightly shorter petals
  var PW=PH*0.38;  // petal width control

  for(var i=0;i<TP;i++){
    var ang=2*Math.PI*i/TP - Math.PI/2;
    var px=CX+PR*Math.cos(ang);
    var py=CY+PR*Math.sin(ang);
    var present=i<petals;

    MX.save();
    MX.translate(px,py);
    MX.rotate(ang+Math.PI/2);

    if(present){
      var gd=MX.createRadialGradient(0,-PH*.2,1,0,-PH*.5,PH);
      gd.addColorStop(0,'#fff0f6');
      gd.addColorStop(0.3,'#f9a8c9');
      gd.addColorStop(0.7,'#e91e8c');
      gd.addColorStop(1,'#c2185b');
      MX.fillStyle=gd;
      MX.strokeStyle='rgba(194,24,91,0.15)';
      MX.lineWidth=0.5;
    } else {
      MX.fillStyle='rgba(255,255,255,0.08)';
      MX.strokeStyle='rgba(255,255,255,0.2)';
      MX.lineWidth=0.5;
      MX.setLineDash([2,3]);
    }

    MX.beginPath();
    MX.moveTo(0, FR*0.3);
    MX.bezierCurveTo(-PW, 0, -PW, -PH*0.8, 0, -PH);
    MX.bezierCurveTo( PW, -PH*0.8,  PW, 0, 0, FR*0.3);
    MX.closePath();
    MX.fill();MX.stroke();MX.setLineDash([]);
    MX.restore();
  }
}

function drawCenter(){
  var alive=petals>0;
  MX.save();
  var gd=MX.createRadialGradient(CX-FR*.2,CY-FR*.2,FR*.08,CX,CY,FR);
  gd.addColorStop(0,alive?'#fffde7':'#f5f5f5');gd.addColorStop(0.5,alive?'#FFD740':'#e0e0e0');gd.addColorStop(1,alive?'#FFB300':'#bdbdbd');
  MX.fillStyle=gd;MX.strokeStyle=alive?'rgba(210,80,0,0.4)':'rgba(150,150,150,0.3)';MX.lineWidth=1.5;
  MX.beginPath();MX.arc(CX,CY,FR,0,Math.PI*2);MX.fill();MX.stroke();MX.restore();
  drawFace(alive);
}

function drawFace(alive){
  MX.save();MX.lineCap='round';var f=face;
  var fs='rgba(70,35,0,0.78)';
  if(!alive||f==='crying'){
    MX.strokeStyle='rgba(80,80,80,0.65)';MX.lineWidth=1.8;
    MX.beginPath();MX.moveTo(CX-FR*.5,CY-FR*.5);MX.quadraticCurveTo(CX-FR*.24,CY-FR*.65,CX-FR*.08,CY-FR*.48);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.08,CY-FR*.48);MX.quadraticCurveTo(CX+FR*.24,CY-FR*.65,CX+FR*.5,CY-FR*.5);MX.stroke();
    MX.lineWidth=2.2;
    MX.beginPath();MX.moveTo(CX-FR*.44,CY-FR*.22);MX.quadraticCurveTo(CX-FR*.26,CY-FR*.38,CX-FR*.1,CY-FR*.22);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.1,CY-FR*.22);MX.quadraticCurveTo(CX+FR*.26,CY-FR*.38,CX+FR*.44,CY-FR*.22);MX.stroke();
    MX.lineWidth=2.4;MX.beginPath();MX.moveTo(CX-FR*.36,CY+FR*.44);MX.quadraticCurveTo(CX,CY+FR*.20,CX+FR*.36,CY+FR*.44);MX.stroke();
    MX.strokeStyle='rgba(100,170,240,0.82)';MX.lineWidth=2;
    [[-FR*.28,-FR*.1],[FR*.28,-FR*.1],[0,-FR*.06]].forEach(function(p){
      MX.beginPath();MX.moveTo(CX+p[0],CY+p[1]);MX.quadraticCurveTo(CX+p[0]-FR*.04,CY+p[1]+FR*.16,CX+p[0],CY+p[1]+FR*.26);MX.stroke();
      MX.fillStyle='rgba(100,170,240,0.62)';MX.beginPath();MX.ellipse(CX+p[0],CY+p[1]+FR*.30,FR*.05,FR*.08,0,0,Math.PI*2);MX.fill();
    });
  } else if(f==='sad_tear'){
    MX.strokeStyle='rgba(80,80,80,0.6)';MX.lineWidth=1.7;
    MX.beginPath();MX.moveTo(CX-FR*.45,CY-FR*.5);MX.quadraticCurveTo(CX-FR*.24,CY-FR*.62,CX-FR*.08,CY-FR*.48);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.08,CY-FR*.48);MX.quadraticCurveTo(CX+FR*.24,CY-FR*.62,CX+FR*.45,CY-FR*.5);MX.stroke();
    MX.lineWidth=2.2;
    MX.beginPath();MX.moveTo(CX-FR*.44,CY-FR*.22);MX.quadraticCurveTo(CX-FR*.26,CY-FR*.38,CX-FR*.1,CY-FR*.22);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.1,CY-FR*.22);MX.quadraticCurveTo(CX+FR*.26,CY-FR*.38,CX+FR*.44,CY-FR*.22);MX.stroke();
    MX.lineWidth=2.4;MX.beginPath();MX.moveTo(CX-FR*.34,CY+FR*.44);MX.quadraticCurveTo(CX,CY+FR*.20,CX+FR*.34,CY+FR*.44);MX.stroke();
    MX.strokeStyle='rgba(100,170,240,0.8)';MX.lineWidth=1.8;
    MX.beginPath();MX.moveTo(CX-FR*.30,CY-FR*.1);MX.quadraticCurveTo(CX-FR*.36,CY+FR*.08,CX-FR*.30,CY+FR*.20);MX.stroke();
    MX.fillStyle='rgba(100,170,240,0.6)';MX.beginPath();MX.ellipse(CX-FR*.30,CY+FR*.24,FR*.05,FR*.08,0,0,Math.PI*2);MX.fill();
  } else if(f==='wink'){
    MX.strokeStyle='rgba(80,40,0,0.48)';MX.lineWidth=1.7;
    MX.beginPath();MX.moveTo(CX-FR*.45,CY-FR*.52);MX.quadraticCurveTo(CX-FR*.24,CY-FR*.64,CX-FR*.08,CY-FR*.5);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.08,CY-FR*.5);MX.quadraticCurveTo(CX+FR*.24,CY-FR*.64,CX+FR*.45,CY-FR*.52);MX.stroke();
    MX.strokeStyle=fs;MX.lineWidth=2.5;
    MX.beginPath();MX.moveTo(CX-FR*.44,CY-FR*.27);MX.quadraticCurveTo(CX-FR*.26,CY-FR*.08,CX-FR*.1,CY-FR*.27);MX.stroke();
    MX.lineWidth=2.1;MX.beginPath();MX.moveTo(CX+FR*.1,CY-FR*.34);MX.lineTo(CX+FR*.43,CY-FR*.17);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.1,CY-FR*.17);MX.lineTo(CX+FR*.43,CY-FR*.34);MX.stroke();
    MX.strokeStyle=fs;MX.lineWidth=2.5;
    MX.beginPath();MX.moveTo(CX-FR*.40,CY+FR*.1);MX.quadraticCurveTo(CX,CY+FR*.52,CX+FR*.40,CY+FR*.1);MX.stroke();
    MX.fillStyle='rgba(255,100,100,0.28)';
    MX.beginPath();MX.ellipse(CX-FR*.58,CY+FR*.08,FR*.20,FR*.12,0,0,Math.PI*2);MX.fill();
    MX.beginPath();MX.ellipse(CX+FR*.58,CY+FR*.08,FR*.20,FR*.12,0,0,Math.PI*2);MX.fill();
  } else {
    MX.strokeStyle='rgba(80,40,0,0.48)';MX.lineWidth=1.7;
    MX.beginPath();MX.moveTo(CX-FR*.45,CY-FR*.52);MX.quadraticCurveTo(CX-FR*.24,CY-FR*.64,CX-FR*.08,CY-FR*.5);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.08,CY-FR*.5);MX.quadraticCurveTo(CX+FR*.24,CY-FR*.64,CX+FR*.45,CY-FR*.52);MX.stroke();
    MX.strokeStyle=fs;MX.lineWidth=2.5;
    MX.beginPath();MX.moveTo(CX-FR*.44,CY-FR*.27);MX.quadraticCurveTo(CX-FR*.26,CY-FR*.08,CX-FR*.1,CY-FR*.27);MX.stroke();
    MX.beginPath();MX.moveTo(CX+FR*.1,CY-FR*.27);MX.quadraticCurveTo(CX+FR*.26,CY-FR*.08,CX+FR*.44,CY-FR*.27);MX.stroke();
    MX.beginPath();MX.moveTo(CX-FR*.40,CY+FR*.1);MX.quadraticCurveTo(CX,CY+FR*.52,CX+FR*.40,CY+FR*.1);MX.stroke();
    MX.fillStyle='rgba(255,100,100,0.26)';
    MX.beginPath();MX.ellipse(CX-FR*.58,CY+FR*.08,FR*.20,FR*.12,0,0,Math.PI*2);MX.fill();
    MX.beginPath();MX.ellipse(CX+FR*.58,CY+FR*.08,FR*.20,FR*.12,0,0,Math.PI*2);MX.fill();
  }
  MX.restore();
}

function drawBubble(){
  var bx=CX+FR*.9,by=CY-FR-SZ*.07,bw=SZ*.32,bh=SZ*.082,br=SZ*.02;
  MX.save();MX.fillStyle='rgba(255,255,255,0.96)';MX.strokeStyle='rgba(233,30,99,0.5)';MX.lineWidth=1.4;
  MX.beginPath();MX.roundRect(bx-bw/2,by-bh/2,bw,bh,br);MX.fill();MX.stroke();
  MX.fillStyle='rgba(255,255,255,0.96)';
  MX.beginPath();MX.moveTo(CX+FR*.38,CY-FR*.55);MX.lineTo(bx-bw*.36,by+bh/2-1);MX.lineTo(bx-bw*.22,by+bh/2-1);MX.closePath();MX.fill();
  MX.fillStyle='#c2185b';MX.font='800 '+Math.round(SZ*.037)+'px Helvetica,sans-serif';
  MX.textAlign='center';MX.textBaseline='middle';MX.fillText(bubText,bx,by);MX.restore();
}

function drawFPs(){
  fp.forEach(function(p){
    MX.save();MX.globalAlpha=p.op;MX.translate(p.x,p.y);MX.rotate(p.rot*Math.PI/180);MX.scale(p.sc,p.sc);
    var pH=SZ*.055;var gd=MX.createRadialGradient(0,-pH*.28,1,0,-pH*.45,pH);
    gd.addColorStop(0,'#ffe0ec');gd.addColorStop(0.5,'#f48fb1');gd.addColorStop(1,'#e91e8c');
    MX.fillStyle=gd;MX.beginPath();MX.moveTo(0,0);MX.bezierCurveTo(-pH*.26,-pH*.32,-pH*.28,-pH*.76,0,-pH);MX.bezierCurveTo(pH*.28,-pH*.76,pH*.26,-pH*.32,0,0);MX.closePath();MX.fill();MX.restore();
  });
}

function drawRing(){
  tokens.forEach(function(l,i){
    var pos=np(i),x=pos.x,y=pos.y,isSel=sel.indexOf(i)>=0;
    MX.save();
    MX.shadowColor='rgba(0,0,0,0.2)';MX.shadowBlur=4;MX.shadowOffsetY=2;
    MX.fillStyle=isSel?'#1565c0':'#ffffff';
    MX.strokeStyle=isSel?'#0d47a1':'rgba(80,140,200,0.7)';
    MX.lineWidth=isSel?2.5:1.8;
    // white halo for separation
    MX.beginPath();MX.arc(x,y,NR+2,0,Math.PI*2);
    MX.fillStyle='rgba(255,255,255,0.25)';MX.fill();
    MX.shadowColor='transparent';
    MX.fillStyle=isSel?'#1565c0':'#ffffff';
    MX.beginPath();MX.arc(x,y,NR,0,Math.PI*2);MX.fill();MX.stroke();
    var fs=Math.max(16,Math.round(NR*1.1));
    MX.font='800 '+fs+'px Helvetica,Arial,sans-serif';
    MX.textAlign='center';MX.textBaseline='middle';
    MX.fillStyle=isSel?'#ffffff':'#0d1b6e';
    MX.fillText(l,x,y+1);
    MX.restore();
  });
}

function drawLines(){
  if(sel.length<2)return;
  MX.save();MX.shadowColor='transparent';
  for(var i=0;i<sel.length-1;i++){
    var a=np(sel[i]),b=np(sel[i+1]);
    MX.strokeStyle='rgba(255,255,255,0.2)';MX.lineWidth=10;MX.lineCap='round';
    MX.beginPath();MX.moveTo(a.x,a.y);MX.lineTo(b.x,b.y);MX.stroke();
    MX.strokeStyle='rgba(255,220,50,0.9)';MX.lineWidth=3;
    MX.beginPath();MX.moveTo(a.x,a.y);MX.lineTo(b.x,b.y);MX.stroke();
  }
  MX.restore();
}

// ── FACE/BUBBLE HELPERS ──────────────────────────────────
function setFace(s,d){face=s;if(fTimer)clearTimeout(fTimer);fTimer=null;if(d>0)fTimer=setTimeout(function(){face='happy';draw();},d);}
function encourage(){
  var p=ENC[0|Math.random()*ENC.length];
  bubText=p;bubOn=true;setFace('wink',1800);draw();
  setTimeout(function(){ sayOne(p.replace('!',''), null); }, 0);
  if(bTimer)clearTimeout(bTimer);
  bTimer=setTimeout(function(){bubOn=false;draw();},2400);
}

// ── TOUCH ────────────────────────────────────────────────
function getXY(cx,cy){
  var r=MC.getBoundingClientRect();
  return{x:(cx-r.left)*(r.width>0?SZ/r.width:1),y:(cy-r.top)*(r.height>0?SZ/r.height:1)};
}
function findNode(cx,cy){
  var p=getXY(cx,cy);
  if(Math.sqrt((p.x-CX)*(p.x-CX)+(p.y-CY)*(p.y-CY))<=FR+10)return -1;
  var best=-1,bd=NR*1.6; // tighter = less accidental hits
  for(var i=0;i<tokens.length;i++){
    var pos=np(i),d=Math.sqrt((p.x-pos.x)*(p.x-pos.x)+(p.y-pos.y)*(p.y-pos.y));
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

function onS(cx,cy){
  // iOS: speak() must be called from touchstart
  flushSpeech();
  var n=findNode(cx,cy);
  if(n===-1){encourage();return;}
  if(n>=0){drag=true;sel=[n];playTouchSound();draw();renderWD();}
}
function onM(cx,cy){
  if(!drag)return;
  var n=findNode(cx,cy);
  if(n>=0&&(sel.length===0||sel[sel.length-1]!==n)){sel.push(n);playTouchSound();draw();renderWD();}
}
function onE(){
  if(!drag&&sel.length===0)return;
  drag=false;submit();
}

MC.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();if(e.touches.length)onS(e.touches[0].clientX,e.touches[0].clientY);},{passive:false,capture:true});
MC.addEventListener('touchmove', function(e){e.preventDefault();e.stopPropagation();if(e.touches.length)onM(e.touches[0].clientX,e.touches[0].clientY);},{passive:false,capture:true});
MC.addEventListener('touchend',  function(e){e.preventDefault();e.stopPropagation();onE();},{passive:false,capture:true});
MC.addEventListener('touchcancel',function(e){e.preventDefault();drag=false;sel=[];draw();renderWD();},{passive:false,capture:true});
MC.addEventListener('mousedown',function(e){onS(e.clientX,e.clientY);});
MC.addEventListener('mousemove',function(e){if(drag)onM(e.clientX,e.clientY);});
window.addEventListener('mouseup',function(){onE();});

// ── GAME ─────────────────────────────────────────────────
function getCur(){return sel.map(function(i){return tokens[i];}).join('');}
function renderWD(){
  var d=document.getElementById('wd');d.innerHTML='';
  getCur().split('').reverse().forEach(function(l){
    var s=document.createElement('div');s.className='wl';s.textContent=l;d.appendChild(s);
  });
}
function updatePBar(){
  var b=document.getElementById('pbar');b.innerHTML='';
  for(var i=0;i<TP;i++){
    var d=document.createElement('span');
    d.style.cssText='font-size:10px;'+(i>=petals?'opacity:.2;filter:grayscale(1)':'');
    d.textContent='🌸';b.appendChild(d);
  }
}
function spawnFP(idx){}  // no falling petals
function animFP(){}

function submit(){
  var word=getCur(),msg=document.getElementById('msg');
  var isN=NAMES.indexOf(word)>=0,alr=found.indexOf(word)>=0;
  if(isN&&!alr){
    found.push(word);

    // Reveal word in crossword
    LAYOUT.forEach(function(L){
      if(L.word!==word)return;
      L.word.split('').forEach(function(l,i){
        var r=L.dir==='h'?L.row:L.row+i,c=L.dir==='h'?L.col+i:L.col;
        if(grid[r]&&grid[r][c])grid[r][c].revealed=true;
      });
    });
    drawCW();
    setFace('wink',1500);draw();
    msg.textContent='✨ '+word+' – נמצא!';
    var ch=document.createElement('div');ch.className='fc';ch.textContent=word;
    document.getElementById('found').appendChild(ch);
    setTimeout(function(){if(msg.textContent.indexOf('נמצא')>=0)msg.textContent='';},1500);
    // Speak name + related phrase
    (function(w){
      setTimeout(function(){
        var extra = NAME_EXTRAS[w];
        if(extra){
          sayOne(w, function(){ setTimeout(function(){ sayOne(extra, null); }, 100); });
        } else {
          sayOne(w, null);
        }
      }, 0);
    })(word);
    if(found.length===NAMES.length){
      setTimeout(function(){
        petals=TP;setFace('wink');draw();
        msg.textContent='🌸 כל המשפחה נמצאה! 🌸';
        // Victory speech immediately
        setTimeout(function(){
          sayList(['כל הכבוד! עשית עבודה נהדרת'].concat(NAMES).concat(['כמה אנחנו ביחד. משפחה גדולה ומיוחדת! ואנחנו 18 איש — וזה חי בגימטריה — לחיים! המשך יום מהנה']), 0);
        }, 0);
      },400);
    }
  } else if(sel.length>=2){
    if(petals>0){
      spawnFP(petals-1);petals--;
      setFace(petals===0?'crying':'sad_tear',petals===0?0:1300);
      playFunnySound();
      draw();animFP();updatePBar();
      msg.textContent='❌ נסה שוב!';
      setTimeout(function(){if(msg.textContent.indexOf('נסה')>=0)msg.textContent='';},1100);
      if(petals===0)setTimeout(function(){msg.textContent='🥀 כל העלים נפלו...';},700);
    }
  }
  sel=[];draw();renderWD();
}

// ── ZOOM ─────────────────────────────────────────────────
var zoomTimer=null;
function showZoom(){
  var ov=document.getElementById('zoom-overlay');
  ov.style.display='flex';
  var zc=document.getElementById('cw-zoom');
  var maxW=Math.min(window.innerWidth-32,400),maxH=window.innerHeight-120;
  var zCS=Math.floor(Math.min(maxW/GC,maxH/GR));
  var zW=GC*zCS+4,zH=GR*zCS+4;
  var zDPR=Math.min(window.devicePixelRatio||1,2);
  zc.width=zW*zDPR;zc.height=zH*zDPR;
  zc.style.width=zW+'px';zc.style.height=zH+'px';
  var zx=zc.getContext('2d');
  zx.setTransform(zDPR,0,0,zDPR,0,0);
  zx.fillStyle='rgba(220,240,255,0.97)';zx.beginPath();zx.roundRect(0,0,zW,zH,8);zx.fill();
  for(var r=0;r<GR;r++) for(var c=0;c<GC;c++){
    var cell=grid[r][c];if(!cell)continue;
    var dc=GC-1-c,x=2+dc*zCS,y=2+r*zCS,s=zCS-2;
    if(cell.revealed){
      zx.fillStyle='#fff';zx.strokeStyle='#64b5f6';zx.lineWidth=1;
      zx.beginPath();zx.roundRect(x,y,s,s,3);zx.fill();zx.stroke();
      zx.fillStyle='#1a3a6b';zx.font='700 '+Math.floor(zCS*0.65)+'px Helvetica,sans-serif';
      zx.textAlign='center';zx.textBaseline='middle';zx.fillText(cell.letter,x+s/2,y+s/2+1);
    } else {
      zx.fillStyle='rgba(180,220,255,0.6)';zx.strokeStyle='rgba(100,160,220,0.8)';zx.lineWidth=0.8;
      zx.beginPath();zx.roundRect(x,y,s,s,3);zx.fill();zx.stroke();
    }
  }
  if(zoomTimer)clearTimeout(zoomTimer);
  zoomTimer=setTimeout(function(){ov.style.display='none';},4000);
}
document.getElementById('zoom-overlay').addEventListener('click',function(){
  if(zoomTimer)clearTimeout(zoomTimer);this.style.display='none';
});

document.getElementById('cw-wrap').addEventListener('click',function(){flushSpeech();showZoom();});

// ── INIT ─────────────────────────────────────────────────
drawCW();draw();updatePBar();

}); // end window.onload
</script>

  <div style="color:#fff;font-size:14px;font-weight:800;margin-bottom:8px;">📋 לחץ לסגירה</div>
  <canvas id="cw-zoom" style="border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4);"></canvas>
</div>
