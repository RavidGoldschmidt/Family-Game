<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech Test 2</title>
<style>
body{font-family:sans-serif;padding:20px;background:#e8f4fd;direction:rtl;}
button{padding:20px;font-size:18px;margin:8px 0;border-radius:12px;border:none;background:#1565c0;color:#fff;cursor:pointer;display:block;width:100%;}
#log{margin-top:20px;padding:12px;background:#fff;border-radius:8px;font-size:14px;line-height:1.8;min-height:60px;}
</style>
</head>
<body>
<h2>בדיקת קול + מוזיקה</h2>

<button id="b1">1. קול בלבד - אמור "שלום"</button>
<button id="b2">2. מוזיקה בלבד - הפעל</button>
<button id="b3">3. מוזיקה ואחר כך קול</button>
<button id="b4">4. עצור הכל</button>

<div id="log">לחץ כפתור...</div>

<script>
var log = document.getElementById('log');
function L(t){ log.innerHTML += t + '<br>'; }

var AC = null;
var bgOn = false;

// ── VOICE ──
function getVoice(){
  var vs = window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++)
    if(vs[i].lang && vs[i].lang.toLowerCase().startsWith('he')) return vs[i];
  return null;
}
function sayNow(text, cb){
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  var v = getVoice(); if(v) u.voice = v;
  u.lang='he-IL'; u.rate=0.9; u.volume=1;
  u.onstart = function(){ L('▶ מתחיל: '+text); };
  u.onend   = function(){ L('✓ סיים: '+text); if(cb) cb(); };
  u.onerror = function(e){ L('✗ שגיאה: '+e.error); if(cb) cb(); };
  window.speechSynthesis.speak(u);
}

// ── AUDIO ──
function getAC(cb){
  if(!AC) AC = new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume().then(cb); else cb();
}
function beep(){
  getAC(function(){
    var o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.frequency.value=440; g.gain.value=0.2;
    o.start(); o.stop(AC.currentTime+0.2);
  });
}
function startMusic(){
  getAC(function(){
    if(bgOn) return;
    bgOn = true;
    L('🎵 מוזיקה מתחילה');
    var bass=[293,220,246,184], ch=[[293,370,440],[220,277,330],[246,293,370],[184,247,311]];
    var i=0;
    function tick(){
      if(!bgOn||!AC) return;
      var o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.type='sine';o.frequency.value=bass[i%4];
      g.gain.setValueAtTime(0.06,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+1.8);
      o.start(AC.currentTime);o.stop(AC.currentTime+1.9);
      ch[i%4].forEach(function(f){
        var o2=AC.createOscillator(),g2=AC.createGain();
        o2.connect(g2);g2.connect(AC.destination);
        o2.type='sine';o2.frequency.value=f;
        g2.gain.setValueAtTime(0.03,AC.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+1.7);
        o2.start(AC.currentTime);o2.stop(AC.currentTime+1.8);
      });
      i++;
      setTimeout(tick,2100);
    }
    tick();
  });
}

// ── BUTTONS ──
document.getElementById('b1').addEventListener('click', function(){
  log.innerHTML = 'בדיקה 1: קול בלבד<br>';
  L('Voices: '+window.speechSynthesis.getVoices().length);
  var v=getVoice();
  L('Voice: '+(v?v.name:'none'));
  sayNow('שלום משפחה יקרה');
});

document.getElementById('b2').addEventListener('click', function(){
  log.innerHTML = 'בדיקה 2: מוזיקה<br>';
  startMusic();
});

document.getElementById('b3').addEventListener('click', function(){
  log.innerHTML = 'בדיקה 3: מוזיקה + קול<br>';
  startMusic();
  setTimeout(function(){
    L('מנסה לדבר עם מוזיקה...');
    sayNow('אורי', function(){
      sayNow('רוחמה', function(){
        sayNow('נגה');
      });
    });
  }, 1500);
});

document.getElementById('b4').addEventListener('click', function(){
  bgOn=false;
  window.speechSynthesis.cancel();
  if(AC) AC.suspend();
  log.innerHTML = 'עצרנו הכל<br>';
});

window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged=function(){ window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
